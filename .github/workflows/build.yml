name: Build processed data

# Re-runs scripts/build.py whenever a raw survey CSV, the bounding box, or the
# build script changes, and commits the regenerated data/processed/* files.
# GitHub Pages (Settings -> Pages -> "Deploy from a branch", main, / root)
# then redeploys the site automatically from that commit.

on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "data/campus_bbox.json"
      - "scripts/build.py"
  workflow_dispatch:
    inputs:
      refresh_buildings:
        description: "Re-download building footprints from OpenStreetMap"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-processed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Building footprints are fetched from OpenStreetMap only when the file is
      # missing (first run) or when you trigger the workflow manually with
      # "refresh_buildings" ticked.  Otherwise the committed copy is reused so
      # routine data pushes never depend on the Overpass API being up.
      - name: Fetch OSM building footprints
        if: ${{ hashFiles('data/buildings.geojson') == '' || inputs.refresh_buildings == true }}
        run: python3 scripts/fetch_buildings.py

      - name: Build GeoJSON from raw CSVs
        run: python3 scripts/build.py

      - name: Commit processed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/buildings.geojson
          if git diff --cached --quiet; then
            echo "Processed data unchanged."
          else
            git commit -m "chore: rebuild processed data [skip ci]"
            git push
          fi
